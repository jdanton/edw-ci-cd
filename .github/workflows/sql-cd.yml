# =============================================================================
# sql-cd.yml
# =============================================================================
#
# Builds the SDK-style database project ONCE and publishes that single DACPAC
# to dev, then test, then prod.
#
# BUILD ONCE, DEPLOY MANY. The DACPAC is built in the first job and passed to
# the others as an artifact. Rebuilding per environment would mean the thing
# approved for production is not the thing that was tested - a subtle and
# entirely avoidable class of release bug.
#
# Environment differences are supplied at PUBLISH time:
#   - the publish profile   (Properties/EdwTaxi.Database.<env>.publish.xml)
#   - SQLCMD variables      (/v:DataFactoryName=..., from Terraform outputs)
#
# THE PROD GATE
# -------------
# Before prod is touched, the workflow runs /Action:DeployReport and
# /Action:Script and publishes both as artifacts. The GitHub Environment
# approval then blocks until a human has read the exact T-SQL that will run.
# Nobody should approve a production schema change they have not read.
#
# NETWORK: sqlpackage speaks TDS to a private endpoint. It cannot run on a
# GitHub-hosted runner. Note that Azure SQL negotiates Redirect mode for
# connections originating inside Azure, so ports 11000-11999 must be open in
# addition to 1433 - the NSG in infra/terraform/modules/network does that.
# =============================================================================

name: Azure SQL CD

on:
  push:
    branches: [main]
    paths:
      - 'src/sql/**'
      - '.github/workflows/sql-cd.yml'
      - '.github/workflows/_sql-publish.yml'

  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'all'
        type: choice
        options: [all, dev, test, prod]
      script_only:
        description: 'Generate the deployment script without applying it'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: sql-cd
  cancel-in-progress: false

env:
  # No TERRAFORM_VERSION here: the three publish jobs are calls to
  # _sql-publish.yml, and the `env` context is not available in a reusable
  # workflow's `with:` block (only github, needs, strategy, matrix, inputs and
  # vars are), so a pin set here could never reach it. It lives on that
  # workflow's terraform_version input instead. DOTNET_MINIMUM_MAJOR stays
  # because the build job below reads it directly.
  DOTNET_MINIMUM_MAJOR: '8'

jobs:

  # ---------------------------------------------------------------------------
  # Which environments actually exist?
  #
  # test and prod have no infrastructure until infra-cd has run for them, and
  # every deployment job aimed at a missing environment fails on its first
  # Terraform read - so a normal push to main goes green on dev and then reports
  # two failures for environments nobody has created yet. That trains people to
  # ignore red, which is worse than the missing environments.
  #
  # This runs as the READ-ONLY CI identity: it needs no `environment:` block,
  # and its OIDC subject on main is repo:<owner>/<repo>:ref:refs/heads/main,
  # which bootstrap federates for exactly this kind of job.
  #
  # It FAILS OPEN. An environment is reported missing only on positive evidence
  # - the backend initialised and the state holds zero resources. If the check
  # itself cannot run, every environment is reported present and the deployment
  # jobs behave exactly as they did before this job existed. A broken probe must
  # never be able to silently skip a production deployment.
  # ---------------------------------------------------------------------------
  preflight:
    name: Which environments exist?
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 10

    outputs:
      dev:  ${{ steps.check.outputs.dev }}
      test: ${{ steps.check.outputs.test }}
      prod: ${{ steps.check.outputs.prod }}

    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CI_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        # A probe that cannot log in must not be able to skip a deployment.
        # Failing here leaves every output unset, which the gates below read as
        # "assume it exists".
        continue-on-error: true

      - name: Read each environment's state
        id: check
        working-directory: infra/terraform
        run: |
          set -uo pipefail
          for env in dev test prod; do
            deployed=true
            reason='probe failed - assuming it exists'
            if terraform init -reconfigure -no-color -backend-config="envs/$env/backend.hcl" >/dev/null 2>&1; then
              count=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
              if [ "$count" = "0" ]; then
                deployed=false
                reason='no resources in state - not deployed yet'
              else
                reason="$count resource(s) in state"
              fi
            fi
            echo "$env=$deployed" >> "$GITHUB_OUTPUT"
            printf '%-5s deployed=%-5s (%s)\n' "$env" "$deployed" "$reason"
          done

      - name: Summary
        run: |
          {
            echo '## Environments'
            echo
            echo '| Environment | Deployed |'
            echo '|---|---|'
            echo '| dev | ${{ steps.check.outputs.dev }} |'
            echo '| test | ${{ steps.check.outputs.test }} |'
            echo '| prod | ${{ steps.check.outputs.prod }} |'
            echo
            echo 'Jobs for an environment that does not exist are skipped, not failed.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build DACPAC
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # WHY THERE IS NO actions/setup-dotnet HERE
      # ---------------------------------------------------------------------
      # setup-dotnet does not detect an SDK installed by the distribution. On
      # Ubuntu, apt installs to /usr/lib/dotnet with a symlink at
      # /usr/bin/dotnet; setup-dotnet hardcodes /usr/share/dotnet and tries to
      # create it as the runner user:
      #
      #     mkdir: cannot create directory '/usr/share/dotnet': Permission denied
      #     Error: Failed to install dotnet, exit code: 1
      #
      # Three ways out, and why this one:
      #
      #   chown /usr/share/dotnet     WRONG. apt owns the .NET tree and root
      #                               should keep it. You would also end up with
      #                               two SDKs and a PATH-order question.
      #
      #   DOTNET_INSTALL_DIR:         Works, and is the right answer if the same
      #     ${{ runner.temp }}/dotnet workflow must also run on GitHub-hosted
      #                               runners. Costs a ~200 MB download and
      #                               ~40s on every run for an SDK that is
      #                               already installed.
      #
      #   use what is installed       This platform builds ONLY on VNet-attached
      #     and assert the version    self-hosted runners - every data-plane
      #     <-- chosen                endpoint is private, so a hosted runner
      #                               cannot deploy anyway. Nothing is
      #                               downloaded, and a runner missing the SDK
      #                               fails with a message that says so.
      #
      # If you fork this for a public-endpoint variant that uses hosted
      # runners, restore setup-dotnet WITH the DOTNET_INSTALL_DIR env var.
      # ---------------------------------------------------------------------
      - name: Verify .NET SDK
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "::error::dotnet is not on PATH on this runner."
            echo "::error::Install it: sudo apt-get install -y dotnet-sdk-8.0"
            exit 1
          fi
          sdk=$(dotnet --version)
          echo "dotnet: $(command -v dotnet)  SDK: $sdk"
          if [ "${sdk%%.*}" -lt "${DOTNET_MINIMUM_MAJOR}" ]; then
            echo "::error::SDK $sdk found; Microsoft.Build.Sql needs .NET ${DOTNET_MINIMUM_MAJOR} or later."
            exit 1
          fi
          dotnet --list-sdks

      # TreatTSqlWarningsAsErrors is set in the .sqlproj, so an unresolved
      # reference - a procedure naming a column that does not exist - fails
      # here instead of at 03:00 in production.
      - name: dotnet build
        run: |
          set -euo pipefail
          dotnet build src/sql/EdwTaxi.Database/EdwTaxi.Database.sqlproj \
            -c Release --nologo

      - name: Summarise the model
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## Database build

          Commit ``${{ github.sha }}`` produced one DACPAC, which every
          environment below will deploy. Nothing is rebuilt per environment.
          "@

      # Stage a FLAT directory before uploading.
      #
      # upload-artifact@v4 roots the archive at the least common ancestor of
      # everything it matches. Listing the dacpac (bin/Release/) and the publish
      # profiles (Properties/) as two patterns makes that root the project
      # directory, so the artifact carries bin/Release/EdwTaxi.Database.dacpac
      # and Properties/EdwTaxi.Database.<env>.publish.xml - and _sql-publish.yml,
      # which downloads into dacpac/ and expects both files directly there,
      # fails with
      #
      #   Error parsing connection string: Could not find file
      #   '.../dacpac/EdwTaxi.Database.dev.publish.xml'
      #
      # naming the profile rather than the layout. Flattening here keeps the
      # surprise in one place instead of in five sqlpackage arguments.
      - name: Stage the publish bundle
        run: |
          set -euo pipefail
          mkdir -p publish-bundle
          cp src/sql/EdwTaxi.Database/bin/Release/*.dacpac        publish-bundle/
          cp src/sql/EdwTaxi.Database/Properties/*.publish.xml    publish-bundle/
          ls -l publish-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: publish-bundle/
          retention-days: 90

  dev:
    name: Publish to dev
    needs: [build, preflight]
    if: |
      needs.preflight.outputs.dev != 'false' &&
      (
        github.event_name == 'push' ||
        inputs.environment == 'all' ||
        inputs.environment == 'dev'
      )
    uses: ./.github/workflows/_sql-publish.yml
    with:
      environment: dev
      script_only: ${{ inputs.script_only == true }}
    secrets: inherit

  test:
    name: Publish to test
    needs: [dev, preflight]
    # `skipped` is accepted ONLY when the operator explicitly targeted this
    # environment alone. Accepting it unconditionally is what let prod deploy
    # after dev FAILED: dev failed -> test skipped -> prod saw "skipped" and
    # ran. 45 resources were created in production off a broken commit.
    #
    # Push and "all" therefore require the previous stage to have SUCCEEDED;
    # a single-environment dispatch requires the earlier stages to have been
    # skipped, which only happens when they were never selected.
    if: |
      always() &&
      needs.preflight.outputs.test != 'false' &&
      (
        ((github.event_name == 'push' || inputs.environment == 'all') &&
          needs.dev.result == 'success')
        ||
        (inputs.environment == 'test' && needs.dev.result == 'skipped')
      )
    uses: ./.github/workflows/_sql-publish.yml
    with:
      environment: test
      script_only: ${{ inputs.script_only == true }}
    secrets: inherit

  prod:
    name: Publish to prod
    needs: [dev, test, preflight]
    # `skipped` is accepted ONLY when the operator explicitly targeted this
    # environment alone. Accepting it unconditionally is what let prod deploy
    # after dev FAILED: dev failed -> test skipped -> prod saw "skipped" and
    # ran. 45 resources were created in production off a broken commit.
    #
    # Push and "all" therefore require the previous stage to have SUCCEEDED;
    # a single-environment dispatch requires the earlier stages to have been
    # skipped, which only happens when they were never selected.
    if: |
      always() &&
      needs.preflight.outputs.prod != 'false' &&
      (
        ((github.event_name == 'push' || inputs.environment == 'all') &&
          needs.dev.result == 'success' && needs.test.result == 'success')
        ||
        (inputs.environment == 'prod' &&
          needs.dev.result == 'skipped' && needs.test.result == 'skipped')
      )
    uses: ./.github/workflows/_sql-publish.yml
    with:
      environment: prod
      script_only: ${{ inputs.script_only == true }}
    secrets: inherit
