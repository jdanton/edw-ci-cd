# =============================================================================
# _terraform-apply.yml   (reusable)
# =============================================================================
#
# Plans and applies the infrastructure for ONE environment.
#
# Called by infra-cd.yml once per environment. Kept reusable so that the plan/
# apply/verify logic exists exactly once - three copies of this drift apart,
# and the copy that drifts is always the production one.
#
# The `environment:` input is what makes the OIDC federation work: the token
# GitHub mints carries the subject `repo:<owner>/<repo>:environment:<env>`, and
# Entra will only exchange it for the service principal whose federated
# credential names that exact subject. A job that omits `environment:` cannot
# authenticate at all, which is a much better failure than one that
# authenticates as the wrong environment.
# =============================================================================

name: Terraform apply (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev, test or prod'
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: '1.9.8'
      apply:
        description: 'Apply, or plan only'
        required: false
        type: boolean
        default: true
      allow_destroy:
        description: |
          Permit an apply whose plan destroys data-bearing resources.

          Defaults to false. The guard step downstream fails the job rather
          than silently rebuilding a Synapse workspace, SQL server, storage
          account or Key Vault - see docs/12-troubleshooting.md#unwanted-replacement
          for the incident that made this necessary.
        type: boolean
        required: false
        default: false
      runner_labels:
        required: false
        type: string
        default: '["self-hosted","Linux","X64","edw"]'
    outputs:
      resource_group_name:
        value: ${{ jobs.terraform.outputs.resource_group_name }}
      data_factory_name:
        value: ${{ jobs.terraform.outputs.data_factory_name }}
      synapse_workspace_name:
        value: ${{ jobs.terraform.outputs.synapse_workspace_name }}
      sql_server_fqdn:
        value: ${{ jobs.terraform.outputs.sql_server_fqdn }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # Must exceed the longest RESOURCE timeout in the configuration - the
    # Synapse workspace allows 90m for create. A job timeout below that turns a
    # slow-but-succeeding apply into a cancelled one, which is strictly worse:
    # Terraform does not get to write state for what it created.
    timeout-minutes: 150

    # Protection rules on this GitHub Environment - required reviewers, wait
    # timers, branch restrictions - are enforced BEFORE the job starts and
    # before any token is issued.
    environment: ${{ inputs.environment }}

    outputs:
      resource_group_name:    ${{ steps.outputs.outputs.resource_group_name }}
      data_factory_name:      ${{ steps.outputs.outputs.data_factory_name }}
      synapse_workspace_name: ${{ steps.outputs.outputs.synapse_workspace_name }}
      sql_server_fqdn:        ${{ steps.outputs.outputs.sql_server_fqdn }}

    env:
      # ---------------------------------------------------------------------
      # azure/login authenticates the AZURE CLI. It does not configure Terraform.
      #
      # Terraform reads ARM_* environment variables, and needs them in two
      # independent places:
      #
      #   the PROVIDER  - can also take subscription_id/tenant_id from tfvars, but
      #                   has no client_id without ARM_CLIENT_ID
      #   the BACKEND   - does NOT see the provider block at all. `use_oidc = true`
      #                   in backend.hcl tells it HOW to authenticate, not AS WHOM.
      #
      # Missing them, `terraform init` fails before it does anything useful:
      #
      #   Error building ARM Config: 2 errors occurred:
      #     * a Tenant ID must be configured when authenticating with OIDC
      #     * a Client ID must be configured when authenticating with OIDC
      #
      # The OIDC token itself needs no wiring: the provider reads
      # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN, which GitHub sets automatically
      # given `permissions: id-token: write`.
      # ---------------------------------------------------------------------
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Silences the "Terraform has no state" nag and keeps logs readable.
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # enable-AzPSSession is required because modules/synapse and
      # modules/datafactory invoke a PowerShell provisioner that shells out to
      # `az`. Without it the CLI is unauthenticated inside the provisioner and
      # the private endpoint approvals fail.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # No enable-AzPSSession here on purpose: the private endpoint approval provisioner shells out to the az CLI,
          # which azure/login has already authenticated. Requesting a PowerShell
          # session would require the Az modules to be installed on the runner and
          # fails on a self-hosted Ubuntu box with the opaque error
          #   Cannot bind argument to parameter 'Name' because it is null.

      - name: terraform init
        working-directory: infra/terraform
        run: |
          terraform init -reconfigure -no-color \
            -backend-config=envs/${{ inputs.environment }}/backend.hcl

      - name: terraform plan
        id: plan
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
          # Capturing it lets the apply step be skipped entirely when there is
          # nothing to do, which keeps the run history honest.
          set +e
          terraform plan -no-color -input=false \
            -var-file=envs/${{ inputs.environment }}/${{ inputs.environment }}.tfvars \
            -detailed-exitcode \
            -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          case $code in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed"; exit 1 ;;
          esac

      - name: Publish plan
        working-directory: infra/terraform
        shell: pwsh
        run: |
          $plan  = Get-Content plan.txt -Raw
          $lines = $plan -split "`n"
          if ($lines.Count -gt 400) {
            $plan = ($lines[0..200] -join "`n") +
                    "`n`n... $($lines.Count - 400) lines omitted, see the artifact ...`n`n" +
                    ($lines[-200..-1] -join "`n")
          }

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## Terraform plan - ${{ inputs.environment }}

          Changes pending: **${{ steps.plan.outputs.has_changes }}**

          <details><summary>Show plan</summary>

          ``````hcl
          $plan
          ``````

          </details>
          "@

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/terraform/plan.txt
          retention-days: 30

      # -----------------------------------------------------------------------
      # Destroy guard.
      #
      # This exists because of a real incident, not as a theoretical control.
      #
      # A ForceNew attribute drifted against a value Azure backfilled by itself
      # (see docs/12-troubleshooting.md#forcenew-null-drift). Every apply then
      # planned a full replacement of the Synapse workspace. The plan said so,
      # correctly, every single time - and it was read as noise, because the
      # surrounding runs were failing on unrelated network errors. The workspace
      # was destroyed and rebuilt repeatedly over the course of a day before
      # anyone read the destroy list.
      #
      # A plan that quietly deletes a data-bearing resource should not be
      # applyable by default. Replacements of cheap, stateless things - role
      # assignments, diagnostic settings, null_resources - stay silent, because
      # blocking on those would train people to set the override permanently.
      # -----------------------------------------------------------------------
      - name: Check plan for destructive changes
        id: guard
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform show -json tfplan > tfplan.json

          python3 - <<'PY' | tee guard.txt
          import json, os

          # Things that hold data, or whose rebuild costs a redeploy of content
          # rather than a few seconds of API calls.
          PROTECTED = {
              'azurerm_synapse_workspace',
              'azurerm_mssql_server',
              'azurerm_mssql_database',
              'azurerm_storage_account',
              'azurerm_storage_data_lake_gen2_filesystem',
              'azurerm_key_vault',
              'azurerm_data_factory',
          }

          plan = json.load(open('tfplan.json'))
          blocked, other = [], []

          for change in plan.get('resource_changes', []):
              actions = change.get('change', {}).get('actions', [])
              if 'delete' not in actions:
                  continue
              verb = 'REPLACE' if 'create' in actions else 'DESTROY'
              entry = f"{verb:8} {change['address']}"
              (blocked if change.get('type') in PROTECTED else other).append(entry)

          if other:
              print("Stateless resources being replaced (allowed):")
              for e in sorted(other):
                  print(f"  {e}")
              print()

          if blocked:
              print("DATA-BEARING RESOURCES WOULD BE DESTROYED:")
              for e in sorted(blocked):
                  print(f"  {e}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"blocked={'true' if blocked else 'false'}\n")
              fh.write(f"count={len(blocked)}\n")
          PY

      - name: Block apply on unapproved destruction
        if: steps.guard.outputs.blocked == 'true' && !inputs.allow_destroy
        working-directory: infra/terraform
        run: |
          {
            echo "## Apply blocked - ${{ inputs.environment }}"
            echo
            echo "This plan destroys **${{ steps.guard.outputs.count }}** data-bearing resource(s):"
            echo
            echo '```'
            cat guard.txt
            echo '```'
            echo
            echo "If this is genuinely intended, re-run with **allow_destroy** enabled."
            echo "If it is not, find the attribute that forced it:"
            echo
            echo '```bash'
            echo "grep -B2 'forces replacement' plan.txt"
            echo '```'
            echo
            echo "See docs/12-troubleshooting.md#unwanted-replacement."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Apply blocked: plan destroys ${{ steps.guard.outputs.count }} data-bearing resource(s). See the job summary."
          exit 1

      - name: terraform apply
        if: inputs.apply && steps.plan.outputs.has_changes == 'true'
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # Applies the SAVED PLAN, not a fresh one. Anything that changed
          # between plan and apply invalidates the file and fails the step -
          # which is exactly what you want after a human approved that plan.
          terraform apply -no-color -input=false -auto-approve tfplan

      - name: No changes
        if: steps.plan.outputs.has_changes == 'false'
        run: echo "Infrastructure already matches the configuration. Nothing applied."

      - name: Capture outputs
        id: outputs
        if: inputs.apply
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          {
            echo "resource_group_name=$(terraform output -raw resource_group_name)"
            echo "data_factory_name=$(terraform output -raw data_factory_name)"
            echo "synapse_workspace_name=$(terraform output -raw synapse_workspace_name)"
            echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Post-apply connectivity assertion.
      #
      # A green apply does NOT mean the platform is usable. If the private DNS
      # zones are not linked to the runner VNet, every later deployment stage
      # will hang and time out - and the error will point at SQL or Synapse
      # rather than at DNS. Failing here, loudly and with the actual cause,
      # saves the afternoon.
      # ---------------------------------------------------------------------
      - name: Verify private data plane is reachable
        if: inputs.apply
        shell: pwsh
        run: ./scripts/Test-PlatformConnectivity.ps1 -Environment ${{ inputs.environment }}

      - name: Warn if DNS is not linked to the runner VNet
        if: inputs.apply
        working-directory: infra/terraform
        shell: pwsh
        run: |
          $linked = terraform output -raw runner_vnet_dns_linked
          $peered = terraform output -raw runner_peering_enabled

          if ($linked -ne 'true' -or $peered -ne 'true') {
            Add-Content $env:GITHUB_STEP_SUMMARY @"
          > **Connectivity warning**
          >
          > - Runner VNet peered: ``$peered``
          > - Private DNS linked to runner VNet: ``$linked``
          >
          > With either of these false, this runner may resolve PUBLIC endpoints
          > for Synapse and Azure SQL. Deployments will hang rather than fail
          > cleanly. See docs/05-runner-connectivity.md.
          "@
          }
