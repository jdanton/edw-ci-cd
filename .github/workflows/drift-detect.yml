# =============================================================================
# drift-detect.yml
# =============================================================================
#
# Runs `terraform plan` against every environment on a schedule and fails if
# anything has changed outside the pipeline.
#
# WHY THIS EARNS ITS KEEP
# -----------------------
# Infrastructure as code is a claim, not a guarantee. The claim quietly stops
# being true when:
#
#   * somebody fixes an incident in the portal at 02:00 and never backports it;
#   * an Azure Policy remediation task changes a setting;
#   * a service's defaults change on the provider's side;
#   * a resource is deleted by a cleanup script that was too broad.
#
# Each of those is invisible until the next deployment silently reverts it -
# usually reintroducing the incident that was fixed at 02:00. Detecting drift
# on a Monday morning is dramatically cheaper than discovering it during a
# release.
#
# This workflow only PLANS. It never applies: automatically "correcting" drift
# is how you delete the emergency fix that is currently holding production
# together. A human decides whether the drift should be adopted into code or
# reverted.
# =============================================================================

name: Drift detection

on:
  schedule:
    # 06:00 UTC every weekday - before European working hours, after the
    # overnight loads have finished.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: drift-detect
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Which environments actually exist?
  #
  # test and prod have no infrastructure until infra-cd has run for them, and
  # every deployment job aimed at a missing environment fails on its first
  # Terraform read - so a normal push to main goes green on dev and then reports
  # two failures for environments nobody has created yet. That trains people to
  # ignore red, which is worse than the missing environments.
  #
  # This runs as the READ-ONLY CI identity: it needs no `environment:` block,
  # and its OIDC subject on main is repo:<owner>/<repo>:ref:refs/heads/main,
  # which bootstrap federates for exactly this kind of job.
  #
  # It FAILS OPEN. An environment is reported missing only on positive evidence
  # - the backend initialised and the state holds zero resources. If the check
  # itself cannot run, every environment is reported present and the deployment
  # jobs behave exactly as they did before this job existed. A broken probe must
  # never be able to silently skip a production deployment.
  # ---------------------------------------------------------------------------
  preflight:
    name: Which environments exist?
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 10

    outputs:
      dev:  ${{ steps.check.outputs.dev }}
      test: ${{ steps.check.outputs.test }}
      prod: ${{ steps.check.outputs.prod }}
      matrix: ${{ steps.check.outputs.matrix }}

    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CI_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        # A probe that cannot log in must not be able to skip anything. Failing
        # here makes every environment fail to initialise, which the step below
        # reads as a fault in the probe rather than three missing environments,
        # so every environment stays in the matrix.
        continue-on-error: true

      - name: Read each environment's state
        id: check
        working-directory: infra/terraform
        run: |
          set -uo pipefail

          # Probe every environment, then decide what the results mean.
          #
          # The decision cannot be made inside the loop, because a failed
          # `terraform init` is ambiguous on its own: it is what a missing state
          # backend looks like, and it is also what a bad credential looks like.
          # Which one it is depends on whether the OTHER environments managed to
          # initialise, and that is not known until the loop has finished.
          present=''
          probe=$(mktemp)
          anyInit=false

          for env in dev test prod; do
            if terraform init -reconfigure -no-color -backend-config="envs/$env/backend.hcl" >/dev/null 2>&1; then
              anyInit=true
              count=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
              # Resources in state is not the same as a usable environment.
              # A failed apply leaves resources behind but writes no outputs,
              # and every deploy script starts with
              # `terraform output -json deployment_config`. Counting resources
              # called such an environment deployed, so the job ran and died on
              # `Output "deployment_config" not found` - a red X on every push
              # for an environment nobody had finished building.
              if [ "$count" = "0" ]; then
                printf '%s\tno\tno resources in state - not deployed yet\n' "$env" >> "$probe"
              elif ! terraform output -json deployment_config >/dev/null 2>&1; then
                printf '%s\tno\t%s resource(s) in state but no deployment_config output - apply never completed\n' "$env" "$count" >> "$probe"
              else
                printf '%s\tyes\t%s resource(s) in state\n' "$env" "$count" >> "$probe"
              fi
            else
              printf '%s\tunknown\tterraform init failed\n' "$env" >> "$probe"
            fi
          done

          # Resolve the ambiguous ones.
          #
          #   some environments initialised  ->  this backend is not there, so
          #                                      the environment has never been
          #                                      bootstrapped. Skip it.
          #   none did                       ->  credentials, network or the
          #                                      runner. Assume everything
          #                                      exists, so a broken probe can
          #                                      never quietly skip a real
          #                                      deployment and report success.
          while IFS="$(printf '\t')" read -r env status reason; do
            case "$status" in
              yes) deployed=true ;;
              no)  deployed=false ;;
              *)
                if [ "$anyInit" = 'true' ]; then
                  deployed=false
                  reason="$reason - other environments initialised, so this one has no state backend"
                else
                  deployed=true
                  reason="$reason - no environment initialised, so this is a credential or network fault rather than a missing environment"
                fi
                ;;
            esac
            echo "$env=$deployed" >> "$GITHUB_OUTPUT"
            printf '%-5s deployed=%-5s (%s)\n' "$env" "$deployed" "$reason"
            if [ "$deployed" = "true" ]; then present="${present}\"$env\","; fi
          done < "$probe"

          # Planning an environment with no state is not drift detection - it
          # reports every resource as "to be created" and raises an issue about
          # infrastructure nobody has asked for yet.
          echo "matrix=[${present%,}]" >> "$GITHUB_OUTPUT"
          echo "matrix: [${present%,}]"

      - name: Summary
        run: |
          {
            echo '## Environments'
            echo
            echo '| Environment | Deployed |'
            echo '|---|---|'
            echo '| dev | ${{ steps.check.outputs.dev }} |'
            echo '| test | ${{ steps.check.outputs.test }} |'
            echo '| prod | ${{ steps.check.outputs.prod }} |'
            echo
            echo 'Jobs for an environment that does not exist are skipped, not failed.'
          } >> "$GITHUB_STEP_SUMMARY"

  detect:
    name: Plan ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 30

    needs: [preflight]
    # An empty matrix is not a valid strategy, so the job is skipped outright
    # when nothing is deployed.
    if: needs.preflight.outputs.matrix != '[]'

    strategy:
      fail-fast: false      # report drift in every environment, not just the first
      matrix:
        environment: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    # The federated credential for test and prod includes a
    # `ref:refs/heads/main` subject precisely so that scheduled runs like this
    # one can authenticate without an `environment:` deployment.
    environment: ${{ matrix.environment }}

    outputs:
      drifted: ${{ steps.plan.outputs.drifted }}

    env:
      # ---------------------------------------------------------------------
      # azure/login authenticates the AZURE CLI. It does not configure Terraform.
      #
      # Terraform reads ARM_* environment variables, and needs them in two
      # independent places:
      #
      #   the PROVIDER  - can also take subscription_id/tenant_id from tfvars, but
      #                   has no client_id without ARM_CLIENT_ID
      #   the BACKEND   - does NOT see the provider block at all. `use_oidc = true`
      #                   in backend.hcl tells it HOW to authenticate, not AS WHOM.
      #
      # Missing them, `terraform init` fails before it does anything useful:
      #
      #   Error building ARM Config: 2 errors occurred:
      #     * a Tenant ID must be configured when authenticating with OIDC
      #     * a Client ID must be configured when authenticating with OIDC
      #
      # The OIDC token itself needs no wiring: the provider reads
      # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN, which GitHub sets automatically
      # given `permissions: id-token: write`.
      # ---------------------------------------------------------------------
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # No enable-AzPSSession here on purpose: this job runs terraform and nothing else,
          # which azure/login has already authenticated. Requesting a PowerShell
          # session would require the Az modules to be installed on the runner and
          # fails on a self-hosted Ubuntu box with the opaque error
          #   Cannot bind argument to parameter 'Name' because it is null.

      - name: terraform init
        working-directory: infra/terraform
        run: |
          terraform init -reconfigure -no-color \
            -backend-config=envs/${{ matrix.environment }}/backend.hcl

      - name: terraform plan
        id: plan
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          set +e
          # -lock=false: this is read-only, and taking the state lock would
          # block a real deployment that happened to start at 06:00.
          terraform plan -no-color -input=false -lock=false -detailed-exitcode \
            -var-file=envs/${{ matrix.environment }}/${{ matrix.environment }}.tfvars \
            2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          case $code in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT"; echo "No drift." ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT"; echo "::warning::Drift detected in ${{ matrix.environment }}." ;;
            *) echo "::error::terraform plan failed for ${{ matrix.environment }}"; exit 1 ;;
          esac

      # -----------------------------------------------------------------------
      # Settings `terraform plan` structurally cannot report.
      #
      # The Synapse workspace must be CREATED with public access enabled - Azure
      # cannot finish provisioning a managed-VNet workspace that cannot reach
      # its own endpoints - and is switched off immediately afterwards by an ARM
      # PATCH. To stop every subsequent plan proposing to turn it back on,
      # public_network_access_enabled sits in the resource's ignore_changes.
      #
      # The cost of that is a blind spot: if somebody enables public access -
      # opening the firewall to debug something is the usual reason - nothing
      # brings it back. The PATCH is a one-shot triggered by workspace
      # creation, and plan is looking the other way by design. The platform
      # quietly stops being private-only and no pipeline says a word.
      #
      # So it is checked here instead, where drift is the subject.
      # -----------------------------------------------------------------------
      - name: Check settings Terraform cannot see
        if: always()
        working-directory: infra/terraform
        shell: pwsh
        run: |
          $workspace = terraform output -raw synapse_workspace_name 2>$null
          $rg        = terraform output -raw resource_group_name 2>$null

          if ([string]::IsNullOrWhiteSpace($workspace)) {
            Write-Host 'No Synapse workspace in this state - nothing to check.'
            exit 0
          }

          $access = az synapse workspace show -n $workspace -g $rg --query publicNetworkAccess -o tsv

          if ($access -eq 'Disabled') {
            Write-Host "  publicNetworkAccess: Disabled (as configured)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- ``$workspace`` publicNetworkAccess: **Disabled**"
          }
          else {
            Write-Host "::warning::$workspace has publicNetworkAccess = $access. This platform is configured private-only (public_network_access_enabled = false), and terraform plan cannot see this setting - it is in ignore_changes. Restore it with: az resource update --ids <workspace id> --set properties.publicNetworkAccess=Disabled"
            Add-Content $env:GITHUB_STEP_SUMMARY "- ``$workspace`` publicNetworkAccess: **$access** - expected Disabled, and plan cannot see it"
          }

      - name: Report
        if: always()
        shell: pwsh
        run: |
          $drifted = '${{ steps.plan.outputs.drifted }}' -eq 'true'

          if (-not $drifted) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## ``${{ matrix.environment }}`` - no drift"
            exit 0
          }

          $plan  = Get-Content infra/terraform/plan.txt -Raw
          $lines = $plan -split "`n"

          # Just the change lines: the summary has a size limit and the
          # surrounding refresh noise helps nobody.
          $changes = $lines | Where-Object { $_ -match '^\s+[~+\-/]' } | Select-Object -First 100

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## ``${{ matrix.environment }}`` - DRIFT DETECTED

          Something changed outside this repository.

          ``````
          $($changes -join "`n")
          ``````

          <details><summary>Full plan</summary>

          ``````hcl
          $(($lines | Select-Object -Last 300) -join "`n")
          ``````

          </details>

          ### What to do

          1. Work out WHO changed it and WHY - check the Activity Log for the
             resource group. Drift is usually a deliberate fix under time
             pressure, not vandalism.
          2. Decide:
             - **Adopt** - the change was right. Put it in ``infra/terraform``
               and open a PR, so the next deployment does not revert it.
             - **Revert** - the change was wrong. Run Infrastructure CD, which
               will restore the declared state.
          3. Do NOT ignore it. The next ``infra-cd`` run reverts this silently.
          "@

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.drifted == 'true'
        with:
          name: drift-plan-${{ matrix.environment }}
          path: infra/terraform/plan.txt
          retention-days: 30

  raise-issue:
    name: Raise an issue if anything drifted
    needs: [detect]
    if: always() && needs.detect.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Open or update the drift issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // The `detect` job is a matrix; its aggregate result is 'failure'
            // only on a genuine plan error. Drift itself is reported via the
            // step summary, so check the job conclusion of the whole matrix.
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const drifted = jobs.data.jobs.filter(j =>
              j.name.startsWith('Plan ') &&
              j.steps.some(s => s.name === 'Report' && s.conclusion === 'success')
            );

            // Nothing to do unless a warning annotation was produced. Keep this
            // conservative: a duplicate issue every weekday morning is the
            // fastest way to get drift detection muted entirely.
            const title = 'Infrastructure drift detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });

            const body = [
              'Scheduled drift detection found differences between the deployed',
              'infrastructure and `infra/terraform`.',
              '',
              `Run: ${runUrl}`,
              '',
              'Open the run summary for the per-environment plan output.',
              '',
              '**Do not close this without deciding**: adopt the change into code,',
              'or revert it by running Infrastructure CD. Ignoring it means the',
              'next deployment reverts it silently.',
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Drift still present as of ${new Date().toISOString()}.\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift', 'infrastructure'],
              });
            }
