# =============================================================================
# adf-cd.yml
# =============================================================================
#
# Deploys the ADF artifacts in src/adf using azure.datafactory.tools.
#
# DEPLOYING FROM THE COLLABORATION BRANCH, NOT adf_publish
# --------------------------------------------------------
# ADF's built-in Git integration offers two deployment sources:
#
#   adf_publish branch   ADF generates an ARM template when someone clicks
#                        "Publish" in Studio. The classic approach, and the
#                        reason so many teams end up with a 40,000-line ARM
#                        template and an ARMTemplateParametersForFactory.json
#                        nobody understands.
#
#   collaboration branch The artifact JSON as authored. What this template uses.
#
# The second is better for three concrete reasons:
#
#   1. NO CLICKING. With adf_publish, a deployment cannot happen until a human
#      opens Studio and presses Publish. That is not continuous delivery, and it
#      means the deployed artifact does not correspond to any reviewed commit.
#
#   2. REVIEWABLE DIFFS. A pull request shows "added a retry policy to the copy
#      activity". The ARM-template equivalent shows a few hundred lines of
#      re-serialised template with the change buried inside.
#
#   3. GRANULARITY. azure.datafactory.tools deploys artifact by artifact, so a
#      single broken linked service fails on its own instead of rolling back an
#      entire ARM deployment.
#
# The cost: `Publish` in Studio must be disabled for the dev factory
# (publishing_enabled = false in the Terraform github_configuration), or
# somebody will click it and generate an adf_publish branch nobody consumes.
# =============================================================================

name: Data Factory CD

on:
  push:
    branches: [main]
    paths:
      - 'src/adf/**'
      - 'scripts/Deploy-DataFactory.ps1'
      - 'scripts/New-DeploymentConfig.ps1'
      - '.github/workflows/adf-cd.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'all'
        type: choice
        options: [all, dev, test, prod]
      dry_run:
        description: 'Report what would be deployed without deploying'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: adf-cd
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.9.8'
  # 1.16.0 is the floor: below it the module hand-builds the ARM auth header
  # from Get-AzAccessToken, which fails as InvalidAuthenticationToken on
  # Az.Accounts 5.x (SecureString) and cannot use an OIDC credential at all.
  ADF_TOOLS_VERSION: '1.18.0'

jobs:

  # ---------------------------------------------------------------------------
  # Which environments actually exist?
  #
  # test and prod have no infrastructure until infra-cd has run for them, and
  # every deployment job aimed at a missing environment fails on its first
  # Terraform read - so a normal push to main goes green on dev and then reports
  # two failures for environments nobody has created yet. That trains people to
  # ignore red, which is worse than the missing environments.
  #
  # This runs as the READ-ONLY CI identity: it needs no `environment:` block,
  # and its OIDC subject on main is repo:<owner>/<repo>:ref:refs/heads/main,
  # which bootstrap federates for exactly this kind of job.
  #
  # It FAILS OPEN. An environment is reported missing only on positive evidence
  # - the backend initialised and the state holds zero resources. If the check
  # itself cannot run, every environment is reported present and the deployment
  # jobs behave exactly as they did before this job existed. A broken probe must
  # never be able to silently skip a production deployment.
  # ---------------------------------------------------------------------------
  preflight:
    name: Which environments exist?
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 10

    outputs:
      dev:  ${{ steps.check.outputs.dev }}
      test: ${{ steps.check.outputs.test }}
      prod: ${{ steps.check.outputs.prod }}

    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CI_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        # A probe that cannot log in must not be able to skip a deployment.
        # Failing here makes every environment fail to initialise, which the
        # step below reads as a fault in the probe rather than three missing
        # environments, and assumes all of them exist.
        continue-on-error: true

      - name: Read each environment's state
        id: check
        working-directory: infra/terraform
        run: |
          set -uo pipefail

          # Probe every environment, then decide what the results mean.
          #
          # The decision cannot be made inside the loop, because a failed
          # `terraform init` is ambiguous on its own: it is what a missing state
          # backend looks like, and it is also what a bad credential looks like.
          # Which one it is depends on whether the OTHER environments managed to
          # initialise, and that is not known until the loop has finished.
          probe=$(mktemp)
          anyInit=false

          for env in dev test prod; do
            if terraform init -reconfigure -no-color -backend-config="envs/$env/backend.hcl" >/dev/null 2>&1; then
              anyInit=true
              count=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
              # Resources in state is not the same as a usable environment.
              # A failed apply leaves resources behind but writes no outputs,
              # and every deploy script starts with
              # `terraform output -json deployment_config`. Counting resources
              # called such an environment deployed, so the job ran and died on
              # `Output "deployment_config" not found` - a red X on every push
              # for an environment nobody had finished building.
              if [ "$count" = "0" ]; then
                printf '%s\tno\tno resources in state - not deployed yet\n' "$env" >> "$probe"
              elif ! terraform output -json deployment_config >/dev/null 2>&1; then
                printf '%s\tno\t%s resource(s) in state but no deployment_config output - apply never completed\n' "$env" "$count" >> "$probe"
              else
                printf '%s\tyes\t%s resource(s) in state\n' "$env" "$count" >> "$probe"
              fi
            else
              printf '%s\tunknown\tterraform init failed\n' "$env" >> "$probe"
            fi
          done

          # Resolve the ambiguous ones.
          #
          #   some environments initialised  ->  this backend is not there, so
          #                                      the environment has never been
          #                                      bootstrapped. Skip it.
          #   none did                       ->  credentials, network or the
          #                                      runner. Assume everything
          #                                      exists, so a broken probe can
          #                                      never quietly skip a real
          #                                      deployment and report success.
          while IFS="$(printf '\t')" read -r env status reason; do
            case "$status" in
              yes) deployed=true ;;
              no)  deployed=false ;;
              *)
                if [ "$anyInit" = 'true' ]; then
                  deployed=false
                  reason="$reason - other environments initialised, so this one has no state backend"
                else
                  deployed=true
                  reason="$reason - no environment initialised, so this is a credential or network fault rather than a missing environment"
                fi
                ;;
            esac
            echo "$env=$deployed" >> "$GITHUB_OUTPUT"
            printf '%-5s deployed=%-5s (%s)\n' "$env" "$deployed" "$reason"
          done < "$probe"

      - name: Summary
        run: |
          {
            echo '## Environments'
            echo
            echo '| Environment | Deployed |'
            echo '|---|---|'
            echo '| dev | ${{ steps.check.outputs.dev }} |'
            echo '| test | ${{ steps.check.outputs.test }} |'
            echo '| prod | ${{ steps.check.outputs.prod }} |'
            echo
            echo 'Jobs for an environment that does not exist are skipped, not failed.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate artifacts
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Test-AdfCode is the module's own static validator. It catches what a
      # JSON parse cannot: a dataset referencing a linked service that does not
      # exist, an activity naming a missing pipeline, a trigger pointing at a
      # deleted pipeline. Every one of those deploys "successfully" and then
      # fails at run time.
      - name: Test-AdfCode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Module -ListAvailable azure.datafactory.tools |
                    Where-Object Version -eq [version]'${{ env.ADF_TOOLS_VERSION }}')) {
            Install-Module azure.datafactory.tools -RequiredVersion '${{ env.ADF_TOOLS_VERSION }}' `
                           -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module azure.datafactory.tools -RequiredVersion '${{ env.ADF_TOOLS_VERSION }}' -Force

          # -ConfigPath is not optional here. Left to itself, Test-AdfCode globs
          # <RootFolder>/deployment/* for *.csv AND *.json and validates every
          # match as one of ITS config files - every top-level property is read
          # as an artifact name to patch. publish-options.json is OUR schema,
          # consumed by scripts/Deploy-DataFactory.ps1, so the first property it
          # meets fails with "ADFT0017: Object [$comment] could not be found."
          # Naming the CSVs explicitly keeps the config validation on the files
          # that are actually config files.
          $result = Test-AdfCode -RootFolder src/adf `
                                 -ConfigPath 'src/adf/deployment/config-*.csv'

          if ($result -and $result.ErrorCount -gt 0) {
            Write-Host "::error::Test-AdfCode reported $($result.ErrorCount) error(s)."
            exit 1
          }
          Write-Host 'ADF artifact validation passed.'

      # Test-AdfCode does not know this rule, and neither does the deployment:
      # a pipeline nesting one container activity inside another validates,
      # publishes and sits there looking correct until someone runs it, when ADF
      # returns
      #
      #   Operation on target <activity> failed: Container activity cannot
      #   include another container activity
      #
      # IfCondition, ForEach, Until and Switch are all containers. The fix is to
      # hoist the inner one to the top level and depend on the outer, or move it
      # into a child pipeline behind an ExecutePipeline.
      - name: Check for nested container activities
        shell: pwsh
        run: |
          $containers = @('IfCondition', 'ForEach', 'Until', 'Switch')
          $bad = @()

          function Test-Activities($activities, $ancestor) {
            foreach ($a in $activities) {
              if ($a.type -in $containers -and $ancestor) {
                $script:bad += [pscustomobject]@{ Outer = $ancestor; Inner = $a.name; Type = $a.type }
              }
              $next = if ($a.type -in $containers) { $a.name } else { $ancestor }
              foreach ($key in @('activities', 'ifTrueActivities', 'ifFalseActivities', 'defaultActivities')) {
                if ($a.typeProperties.$key) { Test-Activities $a.typeProperties.$key $next }
              }
              foreach ($case in $a.typeProperties.cases) {
                if ($case.activities) { Test-Activities $case.activities $next }
              }
            }
          }

          Get-ChildItem src/adf/pipeline -Filter *.json | ForEach-Object {
            $script:bad = @()
            $pipeline = Get-Content $_.FullName -Raw | ConvertFrom-Json
            Test-Activities $pipeline.properties.activities $null
            foreach ($b in $script:bad) {
              Write-Host "::error file=$($_.FullName)::$($b.Type) '$($b.Inner)' is nested inside container '$($b.Outer)'. ADF rejects this at RUN time, not at deployment."
              $bad += $b
            }
          }

          if ($bad.Count -gt 0) { exit 1 }
          Write-Host 'No nested container activities.'

      - name: Report artifact inventory
        shell: pwsh
        run: |
          $rows = Get-ChildItem src/adf -Directory |
                  Where-Object Name -ne 'deployment' |
                  ForEach-Object {
                    [pscustomobject]@{
                      Type  = $_.Name
                      Count = (Get-ChildItem $_.FullName -Filter *.json -Recurse).Count
                    }
                  }

          $table = ($rows | ForEach-Object { "| $($_.Type) | $($_.Count) |" }) -join "`n"

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## ADF artifacts

          | Type | Count |
          |---|---|
          $table

          > ``integrationRuntime`` and ``managedVirtualNetwork`` are owned by
          > Terraform and excluded from publication. See
          > ``src/adf/deployment/publish-options.json``.
          "@

  dev:
    name: Deploy to dev
    needs: [validate, preflight]
    if: |
      needs.preflight.outputs.dev != 'false' &&
      (
        github.event_name == 'push' ||
        inputs.environment == 'all' ||
        inputs.environment == 'dev'
      )
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 45
    environment: dev
    # ---------------------------------------------------------------------
    # JOB-level, not step-level. azure/login authenticates the Azure CLI only;
    # Terraform reads its own ARM_* variables, in the provider AND in the
    # backend (which never sees the provider block).
    #
    # These sat on individual steps until `terraform init` passed and the very
    # next step - a script that shells out to `terraform output` - failed with
    # "a Tenant ID must be configured when authenticating with OIDC". Anything
    # in the job may invoke Terraform, so the credentials belong to the job.
    # ---------------------------------------------------------------------
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # azure/login's enable-AzPSSession requires Az.Accounts to ALREADY be
      # present - the action imports it to call Connect-AzAccount. GitHub-hosted
      # runners ship the Az modules preinstalled; a self-hosted Ubuntu runner
      # does not, and the action then fails with the thoroughly unhelpful
      #
      #   Cannot bind argument to parameter 'Name' because it is null.
      #
      # Pre-install them on the runner to skip this step's ~60s.
      #
      # Az.Resources is not optional either, and nothing above hints at it:
      # azure.datafactory.tools publishes with Method 'AzResource' by default,
      # and its Deploy-AdfObjectOnly calls New-AzResource. Without the module
      # the run gets all the way to the first linked service before dying on
      # "The term 'New-AzResource' is not recognized" - after the triggers have
      # already been stopped.
      - name: Ensure Az PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in @('Az.Accounts','Az.Resources','Az.DataFactory')) {
            $found = Get-Module -ListAvailable -Name $m | Select-Object -First 1
            if ($found) {
              Write-Host "$m $($found.Version) already present"
            } else {
              Write-Host "installing $m ..."
              Install-Module $m -Scope CurrentUser -Force -AllowClobber -Repository PSGallery
            }
          }

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # azure.datafactory.tools is built on the Az PowerShell modules, so
          # an authenticated Az context is required. Without this flag only the
          # Azure CLI is signed in and the module fails with
          # "Run Connect-AzAccount to login".
          enable-AzPSSession: true

      - name: terraform init (read outputs)
        working-directory: infra/terraform
        run: terraform init -reconfigure -no-color -backend-config=envs/dev/backend.hcl
      - name: Deploy
        shell: pwsh
        run: |
          $splat = @{ Environment = 'dev'; ModuleVersion = '${{ env.ADF_TOOLS_VERSION }}' }
          if ('${{ inputs.dry_run }}' -eq 'true') { $splat['WhatIf'] = $true }
          ./scripts/Deploy-DataFactory.ps1 @splat

  test:
    name: Deploy to test
    needs: [dev, preflight]
    # `skipped` is accepted ONLY when the operator explicitly targeted this
    # environment alone. Accepting it unconditionally is what let prod deploy
    # after dev FAILED: dev failed -> test skipped -> prod saw "skipped" and
    # ran. 45 resources were created in production off a broken commit.
    #
    # Push and "all" therefore require the previous stage to have SUCCEEDED;
    # a single-environment dispatch requires the earlier stages to have been
    # skipped, which only happens when they were never selected.
    if: |
      always() &&
      needs.preflight.outputs.test != 'false' &&
      (
        ((github.event_name == 'push' || inputs.environment == 'all') &&
          needs.dev.result == 'success')
        ||
        (inputs.environment == 'test' && needs.dev.result == 'skipped')
      )
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 45
    environment: test
    # ---------------------------------------------------------------------
    # JOB-level, not step-level. azure/login authenticates the Azure CLI only;
    # Terraform reads its own ARM_* variables, in the provider AND in the
    # backend (which never sees the provider block).
    #
    # These sat on individual steps until `terraform init` passed and the very
    # next step - a script that shells out to `terraform output` - failed with
    # "a Tenant ID must be configured when authenticating with OIDC". Anything
    # in the job may invoke Terraform, so the credentials belong to the job.
    # ---------------------------------------------------------------------
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # azure/login's enable-AzPSSession requires Az.Accounts to ALREADY be
      # present - the action imports it to call Connect-AzAccount. GitHub-hosted
      # runners ship the Az modules preinstalled; a self-hosted Ubuntu runner
      # does not, and the action then fails with the thoroughly unhelpful
      #
      #   Cannot bind argument to parameter 'Name' because it is null.
      #
      # Pre-install them on the runner to skip this step's ~60s.
      #
      # Az.Resources is not optional either, and nothing above hints at it:
      # azure.datafactory.tools publishes with Method 'AzResource' by default,
      # and its Deploy-AdfObjectOnly calls New-AzResource. Without the module
      # the run gets all the way to the first linked service before dying on
      # "The term 'New-AzResource' is not recognized" - after the triggers have
      # already been stopped.
      - name: Ensure Az PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in @('Az.Accounts','Az.Resources','Az.DataFactory')) {
            $found = Get-Module -ListAvailable -Name $m | Select-Object -First 1
            if ($found) {
              Write-Host "$m $($found.Version) already present"
            } else {
              Write-Host "installing $m ..."
              Install-Module $m -Scope CurrentUser -Force -AllowClobber -Repository PSGallery
            }
          }

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: terraform init (read outputs)
        working-directory: infra/terraform
        run: terraform init -reconfigure -no-color -backend-config=envs/test/backend.hcl
      - name: Deploy
        shell: pwsh
        run: |
          $splat = @{ Environment = 'test'; ModuleVersion = '${{ env.ADF_TOOLS_VERSION }}' }
          if ('${{ inputs.dry_run }}' -eq 'true') { $splat['WhatIf'] = $true }
          ./scripts/Deploy-DataFactory.ps1 @splat

  prod:
    name: Deploy to prod
    needs: [dev, test, preflight]
    # `skipped` is accepted ONLY when the operator explicitly targeted this
    # environment alone. Accepting it unconditionally is what let prod deploy
    # after dev FAILED: dev failed -> test skipped -> prod saw "skipped" and
    # ran. 45 resources were created in production off a broken commit.
    #
    # Push and "all" therefore require the previous stage to have SUCCEEDED;
    # a single-environment dispatch requires the earlier stages to have been
    # skipped, which only happens when they were never selected.
    if: |
      always() &&
      needs.preflight.outputs.prod != 'false' &&
      (
        ((github.event_name == 'push' || inputs.environment == 'all') &&
          needs.dev.result == 'success' && needs.test.result == 'success')
        ||
        (inputs.environment == 'prod' &&
          needs.dev.result == 'skipped' && needs.test.result == 'skipped')
      )
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","edw"]') }}
    timeout-minutes: 45
    environment: prod
    # ---------------------------------------------------------------------
    # JOB-level, not step-level. azure/login authenticates the Azure CLI only;
    # Terraform reads its own ARM_* variables, in the provider AND in the
    # backend (which never sees the provider block).
    #
    # These sat on individual steps until `terraform init` passed and the very
    # next step - a script that shells out to `terraform output` - failed with
    # "a Tenant ID must be configured when authenticating with OIDC". Anything
    # in the job may invoke Terraform, so the credentials belong to the job.
    # ---------------------------------------------------------------------
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # azure/login's enable-AzPSSession requires Az.Accounts to ALREADY be
      # present - the action imports it to call Connect-AzAccount. GitHub-hosted
      # runners ship the Az modules preinstalled; a self-hosted Ubuntu runner
      # does not, and the action then fails with the thoroughly unhelpful
      #
      #   Cannot bind argument to parameter 'Name' because it is null.
      #
      # Pre-install them on the runner to skip this step's ~60s.
      #
      # Az.Resources is not optional either, and nothing above hints at it:
      # azure.datafactory.tools publishes with Method 'AzResource' by default,
      # and its Deploy-AdfObjectOnly calls New-AzResource. Without the module
      # the run gets all the way to the first linked service before dying on
      # "The term 'New-AzResource' is not recognized" - after the triggers have
      # already been stopped.
      - name: Ensure Az PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in @('Az.Accounts','Az.Resources','Az.DataFactory')) {
            $found = Get-Module -ListAvailable -Name $m | Select-Object -First 1
            if ($found) {
              Write-Host "$m $($found.Version) already present"
            } else {
              Write-Host "installing $m ..."
              Install-Module $m -Scope CurrentUser -Force -AllowClobber -Repository PSGallery
            }
          }

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: terraform init (read outputs)
        working-directory: infra/terraform
        run: terraform init -reconfigure -no-color -backend-config=envs/prod/backend.hcl
      # In prod the trigger is STARTED (config-prod.csv). azure.datafactory.tools
      # stops every trigger before publishing and restarts the ones that should
      # run - ADF refuses to modify a pipeline referenced by a running trigger.
      # Record the before state so an interrupted deployment can be reconciled.
      - name: Record trigger state before deployment
        shell: pwsh
        run: |
          $rg  = terraform -chdir=infra/terraform output -raw resource_group_name
          $adf = terraform -chdir=infra/terraform output -raw data_factory_name

          $triggers = az datafactory trigger list `
                        --resource-group $rg --factory-name $adf `
                        --query "[].{name:name, state:properties.runtimeState}" -o json |
                      ConvertFrom-Json

          $table = ($triggers | ForEach-Object { "| ``$($_.name)`` | $($_.state) |" }) -join "`n"

          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ### Trigger state BEFORE deployment

          | Trigger | State |
          |---|---|
          $table
          "@

      - name: Deploy
        shell: pwsh
        run: |
          $splat = @{ Environment = 'prod'; ModuleVersion = '${{ env.ADF_TOOLS_VERSION }}' }
          if ('${{ inputs.dry_run }}' -eq 'true') { $splat['WhatIf'] = $true }
          ./scripts/Deploy-DataFactory.ps1 @splat

      - name: Verify triggers were restarted
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $rg  = terraform -chdir=infra/terraform output -raw resource_group_name
          $adf = terraform -chdir=infra/terraform output -raw data_factory_name

          $expected = Import-Csv src/adf/deployment/config-prod.csv |
                      Where-Object { $_.type -eq 'trigger' -and $_.path -eq 'runtimeState' -and $_.value -eq 'Started' }

          $actual = az datafactory trigger list `
                      --resource-group $rg --factory-name $adf `
                      --query "[].{name:name, state:properties.runtimeState}" -o json |
                    ConvertFrom-Json

          $problems = @()
          foreach ($e in $expected) {
            $a = $actual | Where-Object name -eq $e.name
            if (-not $a)                   { $problems += "$($e.name) is missing from the factory" }
            elseif ($a.state -ne 'Started') { $problems += "$($e.name) is '$($a.state)', expected 'Started'" }
          }

          if ($problems) {
            Write-Host "::error::Triggers were not left in the expected state after deployment:"
            $problems | ForEach-Object { Write-Host "::error::  $_" }
            Write-Host "::error::PRODUCTION LOADS WILL NOT RUN. Start them manually in ADF Studio, then investigate."
            exit 1
          }

          Write-Host 'All expected triggers are Started.'
